	[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api_providers"
version = "1.0.0"
description = "Centralized API provider and key management system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.0.0",
]
