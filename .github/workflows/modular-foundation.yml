name: Modular integration foundation
on:
  push:
    branches:
      - feature/modular-integration-foundation-20261104
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[service]"
      - run: python -m unittest discover -s tests -v
